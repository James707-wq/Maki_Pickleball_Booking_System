<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="auth">
  <main class="auth-shell">
    <aside class="auth-visual">
      <img class="bgimg" src="img/courts/court-2.jpg" alt="" />
      <a class="av-brand" href="index.html"><span class="mark"><img src="img/logo-mark.png" alt="" /></span><span>MAKI'S<small>PICKLEBALL COURT</small></span></a>
      <div>
        <h2>Locked out?<br><em>No stress.</em></h2>
        <p>We'll send a secure link to your email so you can get back in the game.</p>
        <div class="float-chips"><span class="float-chip">⚡ Book in <b>30 sec</b></span><span class="float-chip">🎾 Real-time slots</span><span class="float-chip">🔔 Smart reminders</span></div>
      </div>
    </aside>
    <section class="auth-panel">
      <div class="auth-card">

          <span class="eyebrow">🔐 Account recovery</span>
          <h1>Reset your password</h1>
          <p class="subtitle">We'll email you a link to reset it</p>

          <form id="forgotForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />

            <div id="captcha" class="captcha"></div>
            <button type="submit" id="submitBtn"><span class="btn-label">Send reset link</span></button>
            <div id="msg" class="msg" role="alert" aria-live="polite"></div>
          </form>

          <div class="links-row">
            <a href="index.html">Back to login</a>
            <span></span>
          </div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    const captcha = Integrations.mountTurnstile('#captcha', (t) => showMsg(document.getElementById('msg'), t));
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      const label = btn.querySelector('.btn-label');
      if (btn.disabled) return;
      btn.disabled = true; btn.classList.add('is-busy'); label.textContent = 'Sending…';
      try {
        const captchaToken = await captcha.getToken();
        const data = await apiRequest('/auth/forgot-password', {
          method: 'POST',
          body: { email: document.getElementById('email').value, captchaToken },
        });
        showMsg(msg, data.message, 'success');
      } catch (err) {
        showMsg(msg, err.message);
      }
      captcha.reset();
      btn.disabled = false; btn.classList.remove('is-busy'); label.textContent = 'Send reset link';
    });
  </script>
</body>
</html>
