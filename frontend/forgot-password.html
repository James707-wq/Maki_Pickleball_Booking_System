<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="auth">
  <div class="navbar" data-nav="guest"></div>

  <div class="container">
    <div class="card">
      <div class="logo-banner"><img src="img/logo.png" alt="MAKI's Pickleball Court" /></div>
      <h1>Reset your password</h1>
      <p class="subtitle">We'll email you a link to reset it</p>

      <form id="forgotForm">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <div id="captcha" class="captcha"></div>
        <button type="submit" id="submitBtn">Send Reset Link</button>
        <div id="msg" class="msg" role="alert" aria-live="polite"></div>
      </form>

      <div class="links-row">
        <a href="index.html">Back to login</a>
        <span></span>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    const captcha = Integrations.mountTurnstile('#captcha', (t) => showMsg(document.getElementById('msg'), t));
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      if (btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const captchaToken = await captcha.getToken();
        const data = await apiRequest('/auth/forgot-password', {
          method: 'POST',
          body: { email: document.getElementById('email').value, captchaToken },
        });
        showMsg(msg, data.message, 'success');
      } catch (err) {
        showMsg(msg, err.message);
      }
      captcha.reset();
      btn.disabled = false; btn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
