<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="auth">
  <main class="auth-shell">
    <aside class="auth-visual">
      <img class="bgimg" src="img/courts/court-4.jpg" alt="" />
      <a class="av-brand" href="index.html"><span class="mark"><img src="img/logo-mark.png" alt="" /></span><span>MAKI'S<small>PICKLEBALL COURT</small></span></a>
      <div>
        <h2>Fresh start,<br><em>new password.</em></h2>
        <p>Choose something strong — at least 8 characters.</p>
        <div class="float-chips"><span class="float-chip">⚡ Book in <b>30 sec</b></span><span class="float-chip">🎾 Real-time slots</span><span class="float-chip">🔔 Smart reminders</span></div>
      </div>
    </aside>
    <section class="auth-panel">
      <div class="auth-card">

          <span class="eyebrow">✨ Almost there</span>
          <h1>Set a new password</h1>
          <p class="subtitle">This link is valid for 30 minutes</p>

          <form id="resetForm">
            <label for="password">New password</label>
            <input type="password" id="password" minlength="8" placeholder="At least 8 characters" autocomplete="new-password" required />

            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="8" placeholder="Type it again" autocomplete="new-password" required />

            <button type="submit">Reset password</button>
            <div id="msg" class="msg"></div>
          </form>

          <div class="links-row">
            <a href="index.html">Back to login</a>
            <span></span>
          </div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!token) return showMsg(msg, 'Missing or invalid reset link');
      if (password !== confirmPassword) return showMsg(msg, 'Passwords do not match');

      try {
        const data = await apiRequest(`/auth/reset-password/${token}`, {
          method: 'PUT',
          body: { password },
        });
        localStorage.setItem('token', data.token);
        showMsg(msg, 'Password reset! Redirecting...', 'success');
        setTimeout(() => (window.location.href = 'dashboard.html'), 1200);
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>
</html>
