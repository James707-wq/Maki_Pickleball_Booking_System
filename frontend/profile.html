<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="app">
  <div class="navbar" data-nav="app"></div>

  <div class="container">
    <div class="card">
      <h1>My Profile</h1>
      <p class="subtitle">View and update your account details</p>

      <form id="profileForm">
        <div class="row-2">
          <div>
            <label for="firstName">First name</label>
            <input type="text" id="firstName" required />
          </div>
          <div>
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" required />
          </div>
        </div>

        <label for="email">Email (cannot be changed)</label>
        <input type="email" id="email" disabled />

        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="e.g. 0917 123 4567" />

        <fieldset id="notifyPrefs" class="notify-prefs" hidden>
          <legend>Booking updates</legend>
          <label id="emailPref" class="check-row" hidden><input type="checkbox" id="notifyEmail" /> Email me booking updates (with a calendar file)</label>
        </fieldset>

        <button type="submit">Save Changes</button>
        <div id="profileMsg" class="msg"></div>
      </form>
    </div>

    <div class="card" id="password" style="margin-top: 20px;">
      <h1>Change Password</h1>
      <p class="subtitle">Update your account password</p>

      <form id="passwordForm">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" required />

        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" minlength="8" required />

        <label for="confirmNewPassword">Confirm new password</label>
        <input type="password" id="confirmNewPassword" minlength="8" required />

        <button type="submit">Change Password</button>
        <div id="passwordMsg" class="msg"></div>
      </form>
    </div>

    <!-- AF-141: the devices signed in to this account -->
    <div class="card" id="devices" style="margin-top: 20px;">
      <h1>Where you're signed in</h1>
      <p class="subtitle">Sign out any device you don't recognise, then change your password.</p>
      <div id="sessionList"><div class="skeleton" aria-label="Loading"><i></i><i></i></div></div>
      <button type="button" id="endOthers" class="secondary" hidden>Sign out all other devices</button>
      <div id="sessionMsg" class="msg" role="status"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    requireAuth();

    async function loadProfile() {
      const data = await apiRequest('/users/profile', { auth: true });
      document.getElementById('firstName').value = data.user.firstName;
      document.getElementById('lastName').value = data.user.lastName;
      document.getElementById('email').value = data.user.email;
      document.getElementById('phone').value = data.user.phone || '';
      document.getElementById('notifyEmail').checked = data.user.notifyEmail !== false;
      // only offer email updates when the facility has email switched on
      const { features } = await Integrations.config();
      document.getElementById('emailPref').hidden = !features.email;
      document.getElementById('notifyPrefs').hidden = !features.email;
    }
    loadProfile();

    // UF-106 Edit Profile
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('profileMsg');
      try {
        await apiRequest('/users/profile', {
          method: 'PUT',
          auth: true,
          body: {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            phone: document.getElementById('phone').value,
            ...(document.getElementById('emailPref').hidden ? {} : { notifyEmail: document.getElementById('notifyEmail').checked }),
          },
        });
        showMsg(msg, 'Profile updated successfully', 'success');
        if (window.navRefreshAccount) window.navRefreshAccount(); // the name in the top bar
      } catch (err) {
        showMsg(msg, err.message);
      }
    });

    // UF-107 Change Password
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('passwordMsg');
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword !== confirmNewPassword) {
        return showMsg(msg, 'New passwords do not match');
      }

      try {
        const r = await apiRequest('/users/change-password', {
          method: 'PUT',
          auth: true,
          body: {
            currentPassword: document.getElementById('currentPassword').value,
            newPassword,
          },
        });
        if (r.token) localStorage.setItem('token', r.token); // this device stays signed in; the others were signed out
        showMsg(msg, r.message || 'Password changed', 'success');
        document.getElementById('passwordForm').reset();
        loadSessions();
      } catch (err) {
        showMsg(msg, err.message);
      }
    });

    // AF-141: where this account is signed in
    const fmtWhen = (d) => new Date(d).toLocaleString('en-PH', { timeZone: 'Asia/Manila', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    async function loadSessions() {
      const box = document.getElementById('sessionList');
      try {
        const { sessions } = await apiRequest('/users/sessions', { auth: true });
        box.innerHTML = sessions.map((x) => `
          <div class="session-row">
            <div><b>${esc(x.device)}</b>${x.current ? ' <span class="pill ok">This device</span>' : ''}
              <span class="session-meta">${esc(x.ip || 'Unknown address')} · signed in ${esc(fmtWhen(x.signedInAt))} · last active ${esc(fmtWhen(x.lastSeenAt))}</span></div>
            ${x.current ? '' : `<button type="button" class="secondary" data-end="${esc(x.id)}">Sign out</button>`}
          </div>`).join('') || '<div class="empty">No devices are signed in.</div>';
        document.getElementById('endOthers').hidden = !sessions.some((x) => !x.current);
      } catch (err) {
        box.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      }
    }
    document.getElementById('sessionList').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-end]');
      if (!b) return;
      b.disabled = true;
      try {
        await apiRequest(`/users/sessions/${b.dataset.end}`, { method: 'DELETE', auth: true });
        showMsg(document.getElementById('sessionMsg'), 'That device was signed out.', 'success');
      } catch (err) { showMsg(document.getElementById('sessionMsg'), err.message); }
      loadSessions();
    });
    document.getElementById('endOthers').addEventListener('click', async () => {
      const b = document.getElementById('endOthers');
      b.disabled = true;
      try {
        const r = await apiRequest('/users/sessions/end-others', { method: 'POST', auth: true });
        showMsg(document.getElementById('sessionMsg'), `${r.ended} other device${r.ended === 1 ? '' : 's'} signed out.`, 'success');
      } catch (err) { showMsg(document.getElementById('sessionMsg'), err.message); }
      b.disabled = false;
      loadSessions();
    });
    loadSessions();
  </script>
</body>
</html>
