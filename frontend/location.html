<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
<style>
  .location-page [hidden] { display: none !important; }
  .loc-lead { color: var(--muted); margin: -6px 0 18px; }
  .loc-main { padding: 22px; }
  .loc-main h2 { margin: 0; font-size: 1.15rem; color: var(--navy-deep); }
  .loc-addr { margin: 4px 0 14px; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
  .loc-addr:empty { display: none; }
  .loc-map { height: 380px; }
  .loc-main .msg { margin: 12px 0 0; }
  .dir-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  /* chips: page-scoped so they win over the site's full-width button and card-link rules */
  .location-page a.dir, .location-page button.dir {
    display: inline-flex; align-items: center; gap: 7px; width: auto; margin: 0; padding: 9px 14px;
    border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--navy);
    font-size: .88rem; font-weight: 600; text-decoration: none; box-shadow: none; transform: none; cursor: pointer;
  }
  .location-page a.dir:hover, .location-page button.dir:hover { border-color: var(--primary); background: var(--tint); color: var(--navy); box-shadow: none; transform: none; }
  .location-page a.dir.main { background: var(--primary); border-color: var(--primary); color: #fff; }
  .location-page a.dir.main:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; }
  .dir svg, .area h3 svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .loc-small { color: var(--muted); font-size: .84rem; margin: 8px 0 0; }
  .loc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .loc-box, .loc-courts { padding: 20px 22px; }
  .loc-box h2, .loc-courts h2 { margin: 0 0 8px; font-size: 1.02rem; color: var(--navy-deep); }
  .loc-box p { overflow-wrap: anywhere; }
  .loc-big { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--primary-dark); }
  .open-now { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .copy-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .location-page button.copy { width: auto; margin: 0; padding: 7px 14px; font-size: .85rem; }
  .loc-courts { margin-top: 18px; }
  .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
  .area { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: #fbfdff; }
  .area h3 { margin: 0 0 8px; font-size: .92rem; color: var(--navy); display: flex; gap: 6px; align-items: flex-start; }
  .area h3 svg { width: 16px; height: 16px; margin-top: 1px; color: var(--primary); }
  .area ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .area li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
  .area .status-badge { margin: 0; }
  @media (max-width: 640px) {
    .loc-grid { grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
    .loc-map { height: 300px; }
    .loc-main, .loc-box, .loc-courts { padding: 16px; }
    .loc-courts { margin-top: 12px; }
  }
</style>
</head>
<body class="app location-page">
  <div class="navbar" data-nav="app"></div>

  <div class="dash-container">
    <h1>Location</h1>
    <p class="loc-lead">Where to find us, how to get here and where each court is.</p>

    <section class="card loc-main" aria-labelledby="locName">
      <h2 id="locName">MAKI's PickleBall Court</h2>
      <p class="loc-addr" id="locAddr">Loading the address…</p>
      <div class="facility-map loc-map" id="locMap" role="region" aria-label="Map of the facility" hidden></div>
      <div class="msg" id="locNote" role="status"></div>
      <div class="dir-row" id="dirRow" hidden></div>
      <p class="loc-small" id="nearMsg" aria-live="polite" hidden></p>
    </section>

    <div class="loc-grid">
      <section class="card loc-box" aria-labelledby="hoursTitle">
        <h2 id="hoursTitle">Opening hours</h2>
        <p class="loc-big" id="hours">…</p>
        <p class="loc-small open-now" id="openNow" hidden></p>
        <p class="loc-small">Philippine time. Each court's free times are on its page.</p>
      </section>
      <section class="card loc-box" aria-labelledby="addrTitle">
        <h2 id="addrTitle">Address</h2>
        <p id="addrText" style="margin:0;">…</p>
        <p class="loc-small" id="coords" hidden></p>
        <div class="copy-row" id="copyRow" hidden>
          <button type="button" class="secondary copy" id="copyBtn">Copy address</button>
          <span class="loc-small" id="copyMsg" style="margin:0;" aria-live="polite"></span>
        </div>
      </section>
    </div>

    <section class="card loc-courts" aria-labelledby="areasTitle">
      <h2 id="areasTitle">Finding your court</h2>
      <p class="loc-small" style="margin-top:0;">Courts by area. Tap a court for its details and free times.</p>
      <div id="areas"><div class="skeleton" aria-label="Loading"><i></i><i></i><i></i></div></div>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    requireAuth();
    const $ = (id) => document.getElementById(id);
    const NAME = "MAKI's PickleBall Court";
    const STATUS = { maintenance: 'Maintenance', unavailable: 'Unavailable', closed: 'Closed' };
    const ICON = {
      route: '<path d="M3 11l18-8-8 18-2-8-8-2z"/>',
      pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
      near: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    };
    const svg = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;
    const chip = (href, label, icon, main) =>
      `<a class="dir${main ? ' main' : ''}" href="${esc(href)}" target="_blank" rel="noopener">${icon ? svg(icon) : ''}${esc(label)}</a>`;

    // "06:00" -> "6:00 AM"
    const clock = (t) => {
      const [h, m] = String(t || '').split(':').map(Number);
      if (!Number.isInteger(h) || !Number.isInteger(m)) return '';
      return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
    };
    const minutes = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
    const manilaMinutes = () => {
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Manila', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
      const get = (type) => Number(parts.find((p) => p.type === type).value);
      return get('hour') * 60 + get('minute');
    };
    // straight-line distance in km between two [lat, lng] points
    const kmBetween = ([lat1, lng1], [lat2, lng2]) => {
      const r = Math.PI / 180;
      const a = Math.sin(((lat2 - lat1) * r) / 2) ** 2
        + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(((lng2 - lng1) * r) / 2) ** 2;
      return 12742 * Math.asin(Math.sqrt(a)); // 12742 km = Earth's diameter
    };
    const away = (km) => (km < 1 ? `about ${Math.max(10, Math.round(km * 100) * 10)} m` : `about ${km < 10 ? km.toFixed(1) : Math.round(km)} km`);

    let map = null;
    let meMarker = null;
    let shareText = '';

    function showHours(hours) {
      const open = hours && hours.open;
      const close = hours && hours.close;
      if (!clock(open) || !clock(close)) { $('hours').textContent = 'Ask at the front desk'; return; }
      $('hours').textContent = `${clock(open)} – ${clock(close)}`;
      const now = manilaMinutes();
      const isOpen = now >= minutes(open) && now < minutes(close);
      $('openNow').innerHTML = isOpen
        ? `<span class="pill ok">Open now</span> until ${esc(clock(close))}`
        : `<span class="pill">Closed now</span> opens at ${esc(clock(open))}`;
      $('openNow').hidden = false;
    }

    async function showFacility() {
      const f = await Integrations.facility();
      if (!f || f.success !== true) {
        $('locAddr').textContent = '';
        showMsg($('locNote'), 'The location could not load. Check your connection and reload the page.');
        $('hours').textContent = '–';
        $('addrText').textContent = '–';
        return;
      }
      const loc = f.location;
      const address = (loc && loc.address) || f.address || '';
      showHours(f.hours);
      $('locAddr').textContent = address;
      $('addrText').textContent = address || (loc ? 'No street address yet. Use the pin on the map.' : 'The facility has not added its address yet.');

      if (!loc) {
        showMsg($('locNote'), "The facility hasn't pinned its spot on the map yet. Ask at the front desk, or message the admin under Support.", 'note');
        if (address) { // the address can still be looked up
          $('dirRow').innerHTML = chip(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`, 'Look it up in Google Maps', 'pin', true);
          $('dirRow').hidden = false;
          shareText = `${NAME}\n${address}`;
          $('copyRow').hidden = false;
        }
        return;
      }

      const d = Integrations.directionLinks(loc);
      $('dirRow').innerHTML = chip(d.google, 'Directions in Google Maps', 'route', true)
        + chip(d.waze, 'Waze') + chip(d.osm, 'OpenStreetMap')
        + `<button type="button" class="secondary dir" id="nearBtn">${svg('near')}How far am I?</button>`;
      $('dirRow').hidden = false;
      $('nearBtn').addEventListener('click', () => howFar(loc));

      $('coords').textContent = `GPS: ${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}`;
      $('coords').hidden = false;
      shareText = [NAME, address, `https://www.google.com/maps/search/?api=1&query=${loc.lat}%2C${loc.lng}`].filter(Boolean).join('\n');
      $('copyBtn').textContent = address ? 'Copy address and map link' : 'Copy map link';
      $('copyRow').hidden = false;

      if (!f.map) return; // map switched off: address and directions only
      const el = $('locMap');
      el.hidden = false;
      try {
        map = await Integrations.osmMap(el, [loc.lat, loc.lng], 16);
        L.marker([loc.lat, loc.lng], { title: NAME, alt: NAME }).addTo(map)
          .bindPopup(`<b>${esc(NAME)}</b>${address ? `<br>${esc(address)}` : ''}`);
      } catch (e) {
        map = null;
        el.replaceWith(Object.assign(document.createElement('p'), { className: 'loc-small', textContent: 'The map could not load. The directions links below still work.' }));
      }
    }

    // "How far am I?": the browser's location is used on this page only and is never sent to the server
    function howFar(loc) {
      const btn = $('nearBtn');
      const out = $('nearMsg');
      out.hidden = false;
      if (!navigator.geolocation || window.isSecureContext === false) {
        out.textContent = 'Finding your location needs a secure (https) connection and a browser that can share it.';
        return;
      }
      btn.disabled = true;
      out.textContent = 'Finding where you are…';
      navigator.geolocation.getCurrentPosition((p) => {
        btn.disabled = false;
        const me = [p.coords.latitude, p.coords.longitude];
        const km = kmBetween(me, [loc.lat, loc.lng]);
        out.textContent = `You are ${away(km)} away in a straight line.${km >= 0.3 ? ' Google Maps or Waze gives the route and travel time.' : ''} Your location stays on this device.`;
        if (!map) return;
        if (meMarker) meMarker.setLatLng(me);
        else {
          meMarker = L.circleMarker(me, { radius: 8, weight: 3, color: '#fff', fillColor: '#0b4fa8', fillOpacity: 1 })
            .addTo(map).bindTooltip('You are here');
        }
        map.fitBounds(L.latLngBounds([me, [loc.lat, loc.lng]]), { padding: [40, 40], maxZoom: 17 });
      }, (err) => {
        btn.disabled = false;
        out.textContent = err.code === 1
          ? 'Location access is blocked. Allow it for this site in your browser, then try again.'
          : 'Your location is not available right now. Try again, or open Google Maps or Waze.';
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    }

    $('copyBtn').addEventListener('click', async () => {
      const msg = $('copyMsg');
      try {
        await navigator.clipboard.writeText(shareText);
        msg.textContent = 'Copied. Paste it in a chat to share.';
      } catch (e) {
        msg.textContent = 'Could not copy. Select the address and copy it instead.';
      }
    });

    async function showCourts() {
      const box = $('areas');
      try {
        const { courts } = await apiRequest('/courts', { auth: true });
        if (!courts.length) { box.innerHTML = '<div class="empty">No courts yet.</div>'; return; }
        const groups = new Map();
        courts.forEach((c) => {
          const area = String(c.location || '').trim() || 'Other courts';
          const key = area.toLowerCase();
          if (!groups.has(key)) groups.set(key, { area, courts: [] });
          groups.get(key).courts.push(c);
        });
        box.className = 'areas';
        box.innerHTML = [...groups.values()]
          .sort((a, b) => a.area.localeCompare(b.area, 'en', { numeric: true }))
          .map((g) => `
            <div class="area">
              <h3>${svg('pin')}<span>${esc(g.area)}</span></h3>
              <ul>${g.courts.map((c) => `
                <li><a href="court-details.html?id=${encodeURIComponent(c._id)}">${esc(c.name)}</a>${STATUS[c.status] ? `<span class="status-badge status-${esc(c.status)}">${esc(STATUS[c.status])}</span>` : ''}</li>`).join('')}
              </ul>
            </div>`).join('');
      } catch (err) {
        box.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      }
    }

    showFacility();
    showCourts();
  </script>
</body>
</html>
