<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Court Details - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="app">
  <div class="navbar" data-nav="app"></div>

  <div class="dash-container">
    <a href="courts.html" class="back-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>All courts</a>

    <div id="courtHero" class="court-hero" style="margin-top:14px;"></div>

    <!-- wide screens: the court and its rules on the left, booking on the right; phones: court, booking, then the rules -->
    <div class="detail-grid">
      <div class="card" id="courtInfo"><div class="skeleton" aria-label="Loading"><i></i><i></i><i></i></div></div>

      <div class="card book-card">
        <h2>Pick a date &amp; time</h2>
        <div class="date-strip" id="dateStrip" aria-label="Next 14 days"></div>
        <div class="date-row">
          <label for="dateInput" style="margin:0;white-space:nowrap;">Or choose a date</label>
          <input type="date" id="dateInput" />
        </div>
        <div id="weatherLine" class="weather-line" hidden aria-live="polite"></div>
        <div class="slot-legend" aria-hidden="true"><span><i></i>Open</span><span><i class="sel"></i>Selected</span><span><i class="off"></i>Booked / closed</span></div>

        <div id="slotsWrap">
          <div class="empty">Pick a date to see available time slots.</div>
        </div>

        <div id="selectionSummary" class="selection-summary"></div>
        <div id="bookCaptcha" class="captcha"></div>
      </div>

      <!-- AF-136 / AF-137: the facility's booking rules and cancellation policy (admin -> Hours & rules) -->
      <section class="card policy-card" id="policyCard" hidden>
        <h2>Before you book</h2>
        <div id="policyBody"></div>
        <p class="subtitle" style="margin:6px 0 0;"><a href="terms.html">All terms and policies</a></p>
      </section>
    </div>

    <section class="card find-us" id="findUs" hidden style="margin-top:18px;"></section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    requireAuth();

    const courtId = new URLSearchParams(window.location.search).get('id');
    const bookCaptcha = Integrations.mountTurnstile('#bookCaptcha', (t) => showMsg(document.getElementById('bookingMsg') || document.createElement('div'), t));
    Integrations.mountFacilityMap(document.getElementById('findUs'), { height: 220 });
    const dateInput = document.getElementById('dateInput');
    let selectedSlot = null;
    let currentCourt = null;

    // Default to today, min = today (no booking into the past)
    const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); // today in Manila
    dateInput.value = today;
    dateInput.min = today;
    // court-details.html?id=...&date=2026-11-20: a link to one court on one day
    const startDate = pageParams().get('date');
    if (/^\d{4}-\d{2}-\d{2}$/.test(startDate || '') && startDate >= today) dateInput.value = startDate;

    // quick-pick strip for the next 14 days (only the days the facility takes bookings for)
    function buildDateStrip() {
      const strip = document.getElementById('dateStrip');
      const base = new Date(today + 'T00:00:00Z');
      let html = '';
      for (let i = 0; i < 14; i += 1) {
        const d = new Date(base.getTime() + i * 864e5);
        const iso = d.toISOString().slice(0, 10);
        if (dateInput.max && iso > dateInput.max) break;
        const wd = i === 0 ? 'Today' : d.toLocaleDateString('en-PH', { weekday: 'short', timeZone: 'UTC' });
        const on = iso === dateInput.value;
        html += `<button type="button" class="date-pill${on ? ' on' : ''}" data-date="${iso}" aria-pressed="${on}"><small>${wd}</small><b>${d.getUTCDate()}</b></button>`;
      }
      strip.innerHTML = html;
    }
    const markPills = () => document.querySelectorAll('.date-pill').forEach((p) => {
      const on = p.dataset.date === dateInput.value;
      p.classList.toggle('on', on);
      p.setAttribute('aria-pressed', String(on));
    });
    // every way of picking a day (the strip, the date box) ends here; the address keeps the day for reloads and links
    function pickDate(iso) {
      if (iso) dateInput.value = iso;
      markPills();
      setPageParams({ date: dateInput.value === today ? '' : dateInput.value });
      loadAvailability();
    }
    buildDateStrip();
    document.getElementById('dateStrip').addEventListener('click', (e) => {
      const pill = e.target.closest('.date-pill');
      if (pill) pickDate(pill.dataset.date);
    });

    // the facility's rules: how far ahead the calendar goes, and the policy shown before booking
    let RULES = null;
    Integrations.mountPolicy(document.getElementById('policyBody'), ['booking', 'cancellation']).then((rules) => {
      if (!rules) return;
      RULES = rules;
      document.getElementById('policyCard').hidden = false;
      if (rules.lastBookableDate) { dateInput.max = rules.lastBookableDate; buildDateStrip(); }
      if (selectedSlot) renderSummary();
    });

    async function loadCourtInfo() {
      const el = document.getElementById('courtInfo');
      try {
        const data = await apiRequest(`/courts/${courtId}`, { auth: true });
        const c = data.court;
        currentCourt = c;
        document.title = `${c.name} - MAKI's PickleBall Court`;
        document.getElementById('courtHero').innerHTML = `
          <img src="${esc(courtImage(c))}" alt="${esc(c.name)}" />
          <div class="ch-text">
            <div>
              <span class="status-badge status-${esc(c.status)}">${esc(c.status)}</span>
              <h1>${esc(c.name)}</h1>
              <p>📍 ${esc(c.location)}</p>
            </div>
            <div class="price-big"><b>₱${esc(c.pricePerHour)}</b><span>per hour</span></div>
          </div>`;
        el.innerHTML = `
          <h2>About this court</h2>
          <p style="margin:0;color:#334155;">${esc(c.description || 'A great spot for a friendly rally or a competitive match.')}</p>
          <div class="facts">
            <div class="fact"><span>Opens</span><b>${esc(c.openTime)}</b></div>
            <div class="fact"><span>Closes</span><b>${esc(c.closeTime)}</b></div>
            <div class="fact"><span>Slot length</span><b>${esc(c.slotDurationMinutes)} min</b></div>
            <div class="fact"><span>Per slot</span><b>₱${Math.round(c.pricePerHour * c.slotDurationMinutes / 60)}</b></div>
          </div>
          ${(c.facilities || []).length ? `<h2 style="font-size:.95rem;margin:4px 0 8px;">Facilities</h2><div class="tags" style="display:flex;flex-wrap:wrap;gap:6px;">${c.facilities.map(f => `<span class="tag">${esc(f)}</span>`).join('')}</div>` : ''}
        `;
      } catch (err) {
        document.getElementById('courtHero').hidden = true;
        el.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      }
    }

    // Forecast for the chosen date (Open-Meteo), when the facility has weather switched on
    async function showWeather(date) {
      const line = document.getElementById('weatherLine');
      line.hidden = true;
      if (!date) return;
      const cfg = await Integrations.config();
      if (!cfg.features.weather) return;
      try {
        const { forecast: f } = await apiRequest(`/weather?date=${encodeURIComponent(date)}`);
        if (!f || dateInput.value !== date) return;
        const wet = f.rain >= 60 ? 'wet' : f.rain >= 30 ? 'maybe' : 'dry';
        line.className = `weather-line ${wet}`;
        line.innerHTML = `<b>Forecast${f.approximate ? ' (Metro Manila)' : ''}:</b> ${esc(f.summary)}, ${f.min}–${f.max}°C · <b>${f.rain}%</b> chance of rain${wet === 'wet' ? ' · consider an indoor court' : ''}`;
        line.hidden = false;
      } catch (e) { /* forecast is optional */ }
    }

    // UF-111 / UF-114: load availability for the selected date
    async function loadAvailability() {
      selectedSlot = null;
      document.getElementById('selectionSummary').style.display = 'none';

      const wrap = document.getElementById('slotsWrap');
      wrap.innerHTML = '<div class="skeleton" aria-label="Loading"><i></i><i></i><i></i></div>';
      showWeather(dateInput.value);

      try {
        const data = await apiRequest(`/courts/${courtId}/availability?date=${dateInput.value}`, { auth: true });

        if (data.courtStatus !== 'available') {
          wrap.innerHTML = `<div class="empty-state"><div class="ill">🚧</div>This court is currently marked "${esc(data.courtStatus)}" and can't be booked.</div>`;
          return;
        }
        if (!data.slots.length) {
          wrap.innerHTML = '<div class="empty">No time slots configured for this court.</div>';
          return;
        }

        wrap.innerHTML = `<div class="slots-grid" id="slotsGrid"></div>`;
        const grid = document.getElementById('slotsGrid');

        data.slots.forEach((slot, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `slot-btn ${slot.status}`;
          btn.textContent = slot.startTime;
          btn.style.animationDelay = `${Math.min(i, 20) * 18}ms`;
          btn.title = slot.status === 'available' ? `${slot.startTime}–${slot.endTime}` : slot.status;
          btn.disabled = slot.status !== 'available'; // booked, blocked or already passed
          btn.addEventListener('click', () => selectSlot(slot, btn));
          grid.appendChild(btn);
        });
      } catch (err) {
        wrap.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      }
    }

    // UF-115: Select Date and Time
    // UF-118: Booking Summary (shown before confirming)
    function selectSlot(slot, btn) {
      document.querySelectorAll('.slot-btn.selected').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSlot = slot;

      renderSummary();
    }

    // AF-127: optional promo code. The server re-checks it when the booking is made.
    let promo = null; // { code, title, discount }
    const baseFee = () => Math.round(currentCourt.pricePerHour * currentCourt.slotDurationMinutes / 60);

    function renderSummary(note = '', noteType = 'error') {
      const summary = document.getElementById('selectionSummary');
      const fee = baseFee();
      const total = promo ? Math.max(fee - promo.discount, 0) : fee;
      summary.style.display = 'block';
      const niceDate = new Date(dateInput.value + 'T00:00:00Z').toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });
      summary.innerHTML = `
        <strong style="font-size:1rem;">Booking summary</strong>
        <div class="summary-rows">
          <div><span>Court</span><b>${esc(currentCourt.name)}</b></div>
          <div><span>Date</span><b>${esc(niceDate)}</b></div>
          <div><span>Time</span><b>${esc(selectedSlot.startTime)}–${esc(selectedSlot.endTime)}</b></div>
          ${promo ? `<div><span>Promo ${esc(promo.code)}</span><b style="color:var(--good);">−₱${promo.discount}</b></div>` : ''}
          <div class="total"><span>Total</span><span>${promo ? `<s style="color:var(--muted);font-size:.9rem;">₱${fee}</s> ` : ''}<b>₱${total}</b></span></div>
        </div>
        <div class="promo-row">
          <input id="promoInput" placeholder="Promo code (optional)" maxlength="20" value="${esc(promo ? promo.code : '')}" aria-label="Promo code" />
          <button type="button" id="promoBtn" class="secondary">${promo ? 'Remove' : 'Apply'}</button>
        </div>
        <div id="promoMsg" class="msg ${note ? noteType : ''}" ${note ? '' : 'style="display:none"'}>${esc(note)}</div>
        <button type="button" id="confirmBookingBtn" class="cta" style="margin-top:16px;">Confirm booking <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        ${RULES ? `<p class="policy-note">${esc(RULES.lines.cancellation.slice(0, 2).join(' '))} <a href="#policyCard">Policy</a></p>` : ''}
        <div id="bookingMsg" class="msg"></div>
      `;
      if (!note) summary.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById('confirmBookingBtn').addEventListener('click', confirmBooking);
      document.getElementById('promoBtn').addEventListener('click', async () => {
        if (promo) { promo = null; return renderSummary(); }
        const code = document.getElementById('promoInput').value.trim();
        if (!code) return renderSummary('Enter a promo code first');
        try {
          const r = await apiRequest('/promotions/check', { method: 'POST', auth: true, body: { code, fee: baseFee() } });
          promo = { code: r.code, title: r.title, discount: r.discount };
          renderSummary();
        } catch (err) { promo = null; renderSummary(err.message); }
      });
    }

    // UF-116: Court Booking
    async function confirmBooking() {
      const msg = document.getElementById('bookingMsg');
      const btn = document.getElementById('confirmBookingBtn');
      btn.disabled = true;
      btn.classList.add('is-busy');

      try {
        const captchaToken = await bookCaptcha.getToken();
        const data = await apiRequest('/bookings', {
          method: 'POST',
          auth: true,
          body: {
            captchaToken,
            courtId,
            date: dateInput.value,
            startTime: selectedSlot.startTime,
            promoCode: promo ? promo.code : undefined,
          },
        });
        // UF-119: Booking Confirmation
        window.location.href = `booking-confirmation.html?id=${data.booking._id}`;
      } catch (err) {
        bookCaptcha.reset();
        showMsg(msg, err.message);
        btn.disabled = false;
        btn.classList.remove('is-busy');
      }
    }

    dateInput.addEventListener('change', () => pickDate());

    loadCourtInfo();
    loadAvailability();
  </script>
</body>
</html>
