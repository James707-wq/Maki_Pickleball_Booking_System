<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin sign in - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/admin.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="admin-login">
  <div class="login-wrap">
    <section class="login-art">
      <img class="logo" src="img/logo.png" alt="MAKI's Pickleball Court" />
    </section>

    <section class="login-form">
      <form id="loginForm" novalidate aria-describedby="msg">
        <h2>Sign in to admin</h2>
        <p class="muted login-sub">Staff and administrator accounts only.</p>

        <!-- Google Sign-In: shown only when it is set up and switched on -->
        <div id="googleBox" class="oauth" hidden>
          <div id="googleBtn" class="oauth-btn"></div>
          <div class="divider"><span>or sign in with email</span></div>
        </div>

        <label class="f">Email
          <input type="email" id="email" autocomplete="username" required autofocus />
        </label>
        <label class="f">Password
          <span class="pw">
            <input type="password" id="password" autocomplete="current-password" required />
            <button type="button" id="pwToggle" aria-label="Show password">Show</button>
          </span>
        </label>

        <!-- Cloudflare Turnstile: runs invisibly, only shows a box if Cloudflare needs a click -->
        <div id="captcha" class="captcha"></div>

        <button class="btn primary" id="submitBtn" type="submit"><span class="label">Sign in</span></button>
        <div id="msg" class="msg error hidden" role="alert" aria-live="assertive"></div>
        <p class="login-alt"><a href="index.html" class="muted">Customer login</a></p>
      </form>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script>
    'use strict';
    const KEY = 'adminToken';
    const API = window.API_ROOT || '/api';
    const $ = (id) => document.getElementById(id);
    const form = $('loginForm');
    const msg = $('msg');
    const btn = $('submitBtn');

    /* ---------- small helpers ---------- */
    const showError = (t) => { msg.textContent = t; msg.classList.remove('hidden'); };
    const clearError = () => msg.classList.add('hidden');
    const busy = (on, text) => {
      form.classList.toggle('is-busy', on);
      btn.disabled = on;
      btn.classList.toggle('is-busy', on);
      btn.querySelector('.label').textContent = on ? (text || 'Signing in…') : 'Sign in';
      form.querySelectorAll('input').forEach((i) => { i.readOnly = on; });
    };
    const loadScript = (src) => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true; s.defer = true;
      s.onload = resolve; s.onerror = () => reject(new Error('load failed'));
      document.head.appendChild(s);
    });
    const signedIn = (token) => { localStorage.setItem(KEY, token); location.replace('admin.html'); };

    // Turn server and network failures into plain messages.
    async function post(path, body) {
      let res;
      try {
        res = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      } catch (e) {
        throw new Error('Cannot reach the server. Check your connection and try again.');
      }
      let data = {};
      try { data = await res.json(); } catch (e) { /* not JSON */ }
      if (res.status === 429) throw new Error('Too many sign-in attempts. Wait a few minutes and try again.');
      if (!res.ok || !data.success) throw new Error(data.message || 'Could not sign in. Please try again.');
      return data;
    }

    /* ---------- already signed in? go straight in ---------- */
    (async () => {
      const t = localStorage.getItem(KEY);
      if (!t) return;
      try {
        const r = await fetch(API + '/admin/me', { headers: { Authorization: 'Bearer ' + t } });
        if (r.ok) location.replace('admin.html');
        else localStorage.removeItem(KEY);
      } catch (e) { /* stay on the sign-in page */ }
    })();

    /* ---------- Cloudflare Turnstile ---------- */
    const captcha = { enabled: false, id: null, token: '', waiters: [] };
    const captchaReady = (t) => { captcha.token = t; captcha.waiters.splice(0).forEach((fn) => fn(t)); };
    // Wait for the invisible check to finish (usually instant), up to 15 seconds.
    function getCaptchaToken() {
      if (!captcha.enabled) return Promise.resolve('');
      if (captcha.token) return Promise.resolve(captcha.token);
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('The human check is taking too long. Reload the page and try again.')), 15000);
        captcha.waiters.push((t) => { clearTimeout(timer); resolve(t); });
      });
    }
    function resetCaptcha() {
      captcha.token = '';
      if (captcha.enabled && window.turnstile && captcha.id !== null) turnstile.reset(captcha.id); // a token works only once
    }
    async function setUpTurnstile(siteKey) {
      try {
        await loadScript('https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit');
      } catch (e) {
        showError('Could not load the human check. Check your connection and reload the page.');
        btn.disabled = true;
        return;
      }
      captcha.enabled = true;
      captcha.id = turnstile.render('#captcha', {
        sitekey: siteKey,
        appearance: 'interaction-only', // invisible unless Cloudflare needs a click
        theme: 'light',
        callback: captchaReady,
        'expired-callback': () => { captcha.token = ''; },
        'error-callback': () => { captcha.token = ''; showError('The human check failed. Reload the page and try again.'); },
      });
    }

    /* ---------- Google Sign-In ---------- */
    async function setUpGoogle(clientId) {
      try {
        await loadScript('https://accounts.google.com/gsi/client');
      } catch (e) { return; } // Google unreachable: email sign-in still works
      google.accounts.id.initialize({
        client_id: clientId,
        ux_mode: 'popup',
        context: 'signin',
        itp_support: true,
        callback: async ({ credential }) => {
          clearError();
          busy(true, 'Signing in with Google…');
          try {
            const data = await post('/auth/admin-google', { credential });
            signedIn(data.token);
          } catch (err) {
            busy(false);
            showError(err.message);
          }
        },
      });
      const box = $('googleBox');
      box.hidden = false;
      const width = Math.max(200, Math.min(400, Math.floor($('googleBtn').getBoundingClientRect().width || form.clientWidth - 56)));
      google.accounts.id.renderButton($('googleBtn'), {
        type: 'standard', theme: 'outline', size: 'large', shape: 'rectangular',
        text: 'continue_with', logo_alignment: 'center', width,
      });
      requestAnimationFrame(() => box.classList.add('is-ready'));
    }

    /* ---------- load what is switched on (keys stay on the server) ---------- */
    (async () => {
      let cfg = {};
      try { cfg = await (await fetch(API + '/integrations/config')).json(); } catch (e) { return; }
      const jobs = [];
      if (cfg.googleClientId) jobs.push(setUpGoogle(cfg.googleClientId));
      if (cfg.turnstileSiteKey) jobs.push(setUpTurnstile(cfg.turnstileSiteKey));
      await Promise.all(jobs);
    })();

    /* ---------- email + password ---------- */
    $('pwToggle').addEventListener('click', (e) => {
      const input = $('password');
      const reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      e.target.textContent = reveal ? 'Hide' : 'Show';
      e.target.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      input.focus();
    });
    form.addEventListener('input', () => {
      clearError();
      form.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (form.classList.contains('is-busy')) return;
      clearError();
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        $('email').setAttribute('aria-invalid', 'true'); $('email').focus();
        return showError('Enter your staff email address.');
      }
      if (!password) {
        $('password').setAttribute('aria-invalid', 'true'); $('password').focus();
        return showError('Enter your password.');
      }

      busy(true, captcha.enabled && !captcha.token ? 'Checking you are human…' : 'Signing in…');
      try {
        const captchaToken = await getCaptchaToken();
        busy(true, 'Signing in…');
        const data = await post('/auth/admin-login', { email, password, captchaToken });
        signedIn(data.token);
      } catch (err) {
        busy(false);
        resetCaptcha();
        showError(err.message);
        $('password').select();
      }
    });
  </script>
</body>
</html>
