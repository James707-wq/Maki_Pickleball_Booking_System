<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="auth">
  <div class="navbar" data-nav="guest"></div>

  <div class="container">
    <div class="card">
      <div class="logo-banner"><img src="img/logo.png" alt="MAKI's Pickleball Court" /></div>
      <h1>Create your account</h1>
      <p class="subtitle">Book courts and manage your schedule</p>

      <!-- Google Sign-In: shown only when the admin has it switched on -->
      <div id="googleBox" class="oauth" hidden>
        <div id="googleBtn" class="oauth-btn"></div>
        <div class="divider"><span>or sign up with email</span></div>
      </div>
      <form id="registerForm">
        <div class="row-2">
          <div>
            <label for="firstName">First name</label>
            <input type="text" id="firstName" required />
          </div>
          <div>
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" required />
          </div>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" />

        <label for="password">Password</label>
        <input type="password" id="password" minlength="8" required />

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" minlength="8" required />

        <div id="captcha" class="captcha"></div>
        <button type="submit" id="submitBtn">Create Account</button>
        <div id="msg" class="msg" role="alert" aria-live="assertive"></div>
      </form>

      <div class="links-row">
        <span></span>
        <a href="index.html">Already have an account?</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    const regBtn = document.getElementById('submitBtn');
    const captcha = Integrations.mountTurnstile('#captcha', (t) => showMsg(document.getElementById('msg'), t));
    Integrations.mountGoogle(document.getElementById('googleBox'), document.getElementById('googleBtn'), {
      text: 'signup_with',
      onCredential: async (credential) => {
        regBtn.disabled = true; regBtn.textContent = 'Signing up with Google…';
        try {
          const data = await apiRequest('/auth/google', { method: 'POST', body: { credential } });
          localStorage.setItem('token', data.token);
          window.location.href = 'dashboard.html';
        } catch (err) {
          regBtn.disabled = false; regBtn.textContent = 'Create Account';
          showMsg(document.getElementById('msg'), err.message);
        }
      },
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (regBtn.disabled) return;
      const msg = document.getElementById('msg');
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        return showMsg(msg, 'Passwords do not match');
      }

      regBtn.disabled = true; regBtn.textContent = 'Creating account…';
      try {
        const captchaToken = await captcha.getToken();
        const data = await apiRequest('/auth/register', {
          method: 'POST',
          body: {
            captchaToken,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password,
          },
        });
        localStorage.setItem('token', data.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        regBtn.disabled = false; regBtn.textContent = 'Create Account';
        captcha.reset();
        showMsg(msg, err.message);
      }
    });
  </script>
</body>
</html>
