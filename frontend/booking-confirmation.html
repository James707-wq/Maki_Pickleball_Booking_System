<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Booking Confirmed - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
<style>
  .receipt { border: 1.5px dashed #d5dfec; border-radius: 16px; padding: 18px; margin-top: 18px; background: #fbfcfe; }
  .receipt-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.92rem; }
  .receipt-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; font-weight: 700; }
  .ref-box {
    text-align: center; background: var(--navy); color: #fff; border-radius: 18px; padding: 20px; margin-top: 16px; position: relative; overflow: hidden;
    box-shadow: 0 18px 30px -18px rgba(10,50,94,.7);
  }
  .ref-box::after { content: ''; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(249,226,11,.45), transparent 65%); }
  .ref-box > div:first-child { color: var(--cyan) !important; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; font-size: .72rem !important; }
  .ref-box .ref { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: 2px; margin-top: 4px; }
  .no-print > .btn, .no-print > button { flex: 1 1 160px; margin-top: 0; }
  @media print { .navbar, .no-print { display: none !important; } }
</style>
</head>
<body class="app">
  <div class="navbar no-print" data-nav="app"></div>

  <div class="container" style="max-width: 600px;">
    <div class="card">
      <div id="content"><div class="skeleton" aria-label="Loading"><i></i><i></i><i></i></div></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/integrations.js"></script>
  <script>
    requireAuth();

    // (split: a payment page that adds "?reference=..." to this address with a second "?" must not break the id)
    const bookingId = (new URLSearchParams(window.location.search).get('id') || '').split('?')[0];

    async function loadBooking() {
      const el = document.getElementById('content');
      try {
        const data = await apiRequest(`/bookings/${bookingId}`, { auth: true });
        const b = data.booking;
        // A receipt exists only once the booking is approved and the payment is verified.
        const hasReceipt = ['confirmed', 'completed'].includes(b.status) && b.paymentStatus === 'paid';
        const STATUS = { pending: 'Pending approval', confirmed: 'Confirmed', completed: 'Completed', cancelled: 'Cancelled', rejected: 'Not approved' };
        const PAY = { pending: b.paymentSubmittedAt ? 'Pending verification' : 'Pending', paid: 'Paid', failed: 'Not verified', refunded: 'Refunded' };
        const payTone = { paid: '#14633c', failed: '#a12a2a', refunded: 'var(--muted)' }[b.paymentStatus] || '#8a5a00';

        el.innerHTML = `
          ${['cancelled', 'rejected'].includes(b.status)
            ? `<h1 style="margin-top:0;">Booking ${b.status === 'rejected' ? 'Not Approved' : 'Cancelled'}</h1>
               <p class="subtitle">${esc(b.statusReason || 'This booking is no longer active.')}</p>`
            : b.status === 'pending'
            ? `<h1 style="margin-top:0;">🕓 Booking Received</h1>
               <p class="subtitle">The facility needs to approve this booking. Your slot is held, and you'll get a notification once it's confirmed.</p>`
            : `<h1 style="margin-top:0;">✅ Booking Confirmed</h1>
               <p class="subtitle">Your court is reserved. Show this reference at check-in.</p>`}

          <div class="ref-box">
            <div style="font-size:0.8rem; color:var(--muted);">Booking Reference</div>
            <div class="ref">${esc(b.referenceNumber)}</div>
          </div>

          <h2 style="font-size:1rem;margin:18px 0 0;">${hasReceipt ? 'Payment Receipt' : 'Booking Details'}</h2>
          <div class="receipt" style="margin-top:8px;">
            <div class="receipt-row"><span>Court</span><span>${esc(b.court?.name || b.courtName)}</span></div>
            <div class="receipt-row"><span>Location</span><span>${esc(b.court?.location || '—')}</span></div>
            <div class="receipt-row"><span>Date</span><span>${fmtDate(b.date)}</span></div>
            <div class="receipt-row"><span>Time</span><span>${esc(b.startTime)}–${esc(b.endTime)}</span></div>
            <div class="receipt-row"><span>Booking Status</span><span>${esc(STATUS[b.status] || b.status)}</span></div>
            <div class="receipt-row"><span>Payment Status</span><span style="font-weight:600;color:${payTone};">${esc(PAY[b.paymentStatus] || b.paymentStatus)}</span></div>
            ${hasReceipt && b.paidAt ? `<div class="receipt-row"><span>Paid on</span><span>${fmtDate(b.paidAt)}</span></div>` : ''}
            ${b.promoCode ? `<div class="receipt-row"><span>Promo ${esc(b.promoCode)}</span><span style="color:#14633c;">−₱${esc(b.discount)}</span></div>` : ''}
            <div class="receipt-row total"><span>${hasReceipt ? 'Total Paid' : 'Total Fee'}</span><span>₱${esc(b.totalFee)}</span></div>
          </div>
          ${hasReceipt ? '' : `<p class="no-print" style="font-size:.85rem;color:var(--muted);margin:8px 0 0;">${
            ['cancelled', 'rejected'].includes(b.status) ? 'No receipt is issued for this booking.'
              : 'Your receipt will be available here once the facility approves your booking and your payment is verified.'}</p>`}

          <div id="paySection" class="no-print"></div>
          <div id="qrSection" class="qr-card" hidden></div>
          <div id="calSection" class="no-print cal-section" hidden></div>
          <div id="reviewSection" class="no-print"></div>

          <div class="no-print" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;">
            ${hasReceipt ? '<button type="button" class="secondary" onclick="window.print()">Print Receipt</button>' : ''}
            <a href="dashboard.html" class="btn" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">Go to Dashboard</a>
            <a href="booking-status.html?reference=${encodeURIComponent(b.referenceNumber)}" class="btn" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">Check Status</a>
          </div>
        `;
        renderPayment(b);
        renderAddToCalendar(b);
        renderCheckinQr(b);
        renderReview(b);
        // a little celebration the first time you land on a new booking
        if (['pending', 'confirmed'].includes(b.status) && !sessionStorage.getItem('cele-' + b._id)) {
          sessionStorage.setItem('cele-' + b._id, '1');
          confetti();
        }
      } catch (err) {
        el.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      }
    }

    // QR code to show at the front desk (confirmed bookings, when QR check-in is switched on)
    async function renderCheckinQr(b) {
      const box = document.getElementById('qrSection');
      if (!box || b.status !== 'confirmed' || b.checkedInAt) return;
      const cfg = await Integrations.config();
      if (!cfg.features.qrCheckin) return;
      try {
        const { code } = await apiRequest(`/bookings/${b._id}/checkin-code`, { auth: true });
        if (!window.qrcode) {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
            s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        const qr = qrcode(0, 'M');
        qr.addData(code);
        qr.make();
        box.innerHTML = `
          <div class="qr-img" role="img" aria-label="Check-in QR code for booking ${esc(b.referenceNumber)}">${qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true })}</div>
          <div><b>Check-in QR code</b><p>Show this at the front desk on the day of your booking. Staff scan it to check you in.</p>
          <p class="qr-ref">Ref: ${esc(b.referenceNumber)}</p></div>`;
        box.hidden = false;
      } catch (e) { /* QR is optional: the reference number still works at the desk */ }
    }

    // Add to calendar (Google, or a .ics file for Apple/Outlook) + where the facility is
    async function renderAddToCalendar(b) {
      const box = document.getElementById('calSection');
      if (!box) return;
      const links = await Integrations.calendarButtons(b);
      if (links) {
        box.innerHTML = `<b>Add it to your calendar</b>${links}<small>Includes a reminder 2 hours before.</small>`;
        box.hidden = false;
      }
      if (!['cancelled', 'rejected'].includes(b.status) && !document.getElementById('findUs')) {
        box.insertAdjacentHTML('afterend', '<section id="findUs" class="find-us no-print" hidden></section>');
        Integrations.mountFacilityMap(document.getElementById('findUs'), { height: 180 });
      }
    }

    // UF-121: customers pay at the front desk (no payment method to choose, no online payment).
    // A reference sent before that change still shows while staff check it.
    function renderPayment(b) {
      const box = document.getElementById('paySection');
      if (['cancelled', 'rejected'].includes(b.status) || b.paymentStatus === 'refunded') { box.innerHTML = ''; return; }
      if (b.paymentStatus === 'paid') { box.innerHTML = '<p style="font-size:.85rem;color:#14633c;margin-top:12px;">✅ Payment received. Thank you!</p>'; return; }
      if (b.paymentStatus === 'pending' && b.paymentSubmittedAt) {
        box.innerHTML = `<p style="font-size:.85rem;color:var(--muted);margin-top:12px;">🕓 We received your payment reference <b>${esc(b.paymentReference)}</b>. Staff will check it shortly.</p>`;
        return;
      }
      box.innerHTML = `<div class="receipt" style="margin-top:16px;">
          <strong>How to pay</strong>
          ${b.paymentStatus === 'failed' ? `<p class="msg error" style="display:block;">Your last payment could not be verified${b.paymentNote ? ': ' + esc(b.paymentNote) : ''}.</p>` : ''}
          <p style="font-size:.88rem;margin:6px 0 0;">Pay at the front desk when you arrive. Show your booking reference <b>${esc(b.referenceNumber)}</b>.</p>
        </div>`;
    }

    // Rating lives on its own page now
    function renderReview(b) {
      const box = document.getElementById('reviewSection');
      box.innerHTML = b.status === 'completed'
        ? `<div class="receipt" style="margin-top:16px;"><strong>How was your game?</strong><p style="margin:6px 0 0;"><a href="feedback.html?booking=${encodeURIComponent(b._id)}">Rate this visit in Feedback &amp; Ratings</a></p></div>`
        : '';
    }

    loadBooking();
  </script>
</body>
</html>
