<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="auth">
  <div class="navbar">
    <a class="brand" href="index.html" aria-label="MAKI's Pickleball Court home">
      <img src="img/logo-mark.png" alt="" />
      <span class="wm"><b>MAKI'S</b><span>PICKLEBALL COURT</span></span>
    </a>
    <div class="links"><a href="index.html">Log in</a></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="logo-banner"><img src="img/logo.png" alt="MAKI's Pickleball Court" /></div>
      <h1>Reset your password</h1>
      <p class="subtitle">We'll email you a link to reset it</p>

      <form id="forgotForm">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <button type="submit">Send Reset Link</button>
        <div id="msg" class="msg"></div>
      </form>

      <div class="links-row">
        <a href="index.html">Back to login</a>
        <span></span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        const data = await apiRequest('/auth/forgot-password', {
          method: 'POST',
          body: { email: document.getElementById('email').value },
        });
        showMsg(msg, data.message, 'success');
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>
</html>
