<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/admin.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body>
  <div class="shell">
    <aside class="side" id="side">
      <a class="brand" href="#/dashboard" aria-label="MAKI's Pickleball Court admin home"><img src="img/logo.png" alt="MAKI's Pickleball Court" /></a>
      <div class="brand-sub">Admin console</div>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="navWrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg> Menu
      </button>

      <div class="nav-wrap" id="navWrap">
        <div class="nav-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="navSearch" placeholder="Search..." autocomplete="off" aria-label="Search the menu" />
          <kbd aria-hidden="true">Ctrl K</kbd>
        </div>
        <nav class="menu" id="nav" aria-label="Admin sections"></nav>
        <div class="me">
          <div class="who"><b id="meName">&nbsp;</b><span id="meRole" class="muted"></span></div>
          <button class="btn small ghost" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="head">
        <div><h1 id="title">Loading</h1><p id="subtitle"></p></div>
        <div class="actions" id="headActions"></div>
      </div>
      <div id="view"><div class="skeleton" aria-label="Loading"><i></i><i></i><i></i><i></i></div></div>
    </main>
  </div>

  <dialog id="modal" autofocus tabindex="-1" aria-labelledby="modalTitle">
    <div class="dlg-head"><h2 id="modalTitle"></h2><button type="button" id="modalClose" aria-label="Close">&times;</button></div>
    <div class="dlg-body" id="modalBody"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/admin-extra.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
