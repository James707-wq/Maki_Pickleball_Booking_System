<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - MAKI's PickleBall Court</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/favicon.png" />
<meta name="theme-color" content="#0a325e" />
</head>
<body class="auth">
  <div class="navbar">
    <a class="brand" href="index.html" aria-label="MAKI's Pickleball Court home">
      <img src="img/logo-mark.png" alt="" />
      <span class="wm"><b>MAKI'S</b><span>PICKLEBALL COURT</span></span>
    </a>
    <div class="links"><a href="index.html">Log in</a></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="logo-banner"><img src="img/logo.png" alt="MAKI's Pickleball Court" /></div>
      <h1>Set a new password</h1>
      <p class="subtitle">This link is valid for 30 minutes</p>

      <form id="resetForm">
        <label for="password">New password</label>
        <input type="password" id="password" minlength="8" required />

        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" minlength="8" required />

        <button type="submit">Reset Password</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!token) return showMsg(msg, 'Missing or invalid reset link');
      if (password !== confirmPassword) return showMsg(msg, 'Passwords do not match');

      try {
        const data = await apiRequest(`/auth/reset-password/${token}`, {
          method: 'PUT',
          body: { password },
        });
        localStorage.setItem('token', data.token);
        showMsg(msg, 'Password reset! Redirecting...', 'success');
        setTimeout(() => (window.location.href = 'dashboard.html'), 1200);
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>
</html>
